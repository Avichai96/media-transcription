<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="htmx-config" content='{"responseHandling":[{"code":".*","swap":true}],"allowEval":false}'>
  <title>Media Transcription</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main class="container" data-max-bytes="{{ limits.max_upload_bytes }}" data-max-mib="{{ limits.max_upload_mib }}">
    <header class="hero">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
      </div>
      <h1>Media transcription</h1>
      <p class="muted">Turn speech in audio or video into text. Everything runs on this server, so your media stays private.</p>
    </header>

    <form id="upload-form" class="card"
          hx-post="{{ action }}" hx-encoding="multipart/form-data"
          hx-target="#result" hx-swap="innerHTML"
          hx-disabled-elt="#submit, #language">
      <label class="dropzone" id="dropzone" for="file">
        <input id="file" name="file" type="file" accept="audio/*,video/*,.mp3,.wav,.m4a,.flac,.ogg,.mp4,.webm,.mov,.mkv" required>
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        <span class="dz-title"><strong>Choose a file</strong> or drag it here</span>
        <span class="muted small">MP3, WAV, M4A, FLAC, OGG, MP4, WEBM &middot; up to {{ limits.max_upload_mib }} MiB &middot; up to {{ limits.max_audio_seconds }} seconds</span>
      </label>

      <div id="file-chip" class="file-chip" hidden>
        <span class="file-name" id="file-name"></span>
        <span class="muted small" id="file-size"></span>
        <button type="button" class="icon-btn" id="clear-file" aria-label="Remove file">&times;</button>
      </div>

      <div class="row">
        <div class="field">
          <label for="language">Spoken language</label>
          <select id="language" name="language">
            <option value="">Auto-detect</option>
            <option value="en">English</option>
            <option value="he">Hebrew</option>
          </select>
        </div>
        <button id="submit" class="btn primary" type="submit" disabled>
          <span class="btn-label">Transcribe</span>
        </button>
      </div>

      <div id="progress" class="progress" hidden aria-live="polite">
        <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
        <p class="muted small" id="progress-text">Uploading…</p>
      </div>
    </form>

    <div id="alert" class="alert" role="alert" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16.5v.01"/></svg>
      <div class="alert-body">
        <strong id="alert-title">Couldn't transcribe this file</strong>
        <span id="alert-message"></span>
      </div>
      <button type="button" class="icon-btn" id="alert-close" aria-label="Dismiss">&times;</button>
    </div>
    <section id="result" aria-live="polite"></section>

    <footer class="foot muted small">
      <a href="/docs">API docs</a> &middot; Open-source Whisper, running locally
    </footer>
  </main>
</body>
</html>
